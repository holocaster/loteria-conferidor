<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Conferidor de Loteria — Mega-Sena, Lotofácil, Quina e mais</title>
    <meta
      name="description"
      content="Cadastre seus números fixos da Mega-Sena, Lotofácil, Quina, Lotomania, Dupla-Sena, Timemania e Dia de Sorte, e veja na hora se bateu com o último sorteio ou com um concurso específico da Caixa."
    />
    <link rel="canonical" href="https://loteria.prsites.com.br/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / redes sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Conferidor de Loteria — Mega-Sena, Lotofácil, Quina e mais" />
    <meta
      property="og:description"
      content="Confira automaticamente se seus números fixos bateram com o sorteio, em todas as principais loterias da Caixa."
    />
    <meta property="og:url" content="https://loteria.prsites.com.br/" />

    <!-- Dados estruturados, ajudam buscadores e assistentes de IA a entender do que se trata a página -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Conferidor de Loteria",
        "applicationCategory": "UtilityApplication",
        "operatingSystem": "Web",
        "description": "Ferramenta gratuita para cadastrar jogos fixos e conferir automaticamente resultados da Mega-Sena, Lotofácil, Quina, Lotomania, Dupla-Sena, Timemania e Dia de Sorte.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "BRL"
        },
        "inLanguage": "pt-BR"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Conteúdo visível para navegadores/robôs que não executam JavaScript.
         O app React acima cobre a experiência interativa; este bloco garante
         que buscadores e crawlers de IA que só leem HTML puro ainda encontrem
         uma descrição real da página. -->
    <noscript>
      <main style="font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; line-height: 1.6;">
        <h1>Conferidor de Loteria</h1>
        <p>
          Ferramenta gratuita para conferir jogos fixos nas loterias da Caixa:
          Mega-Sena, Lotofácil, Quina, Lotomania, Dupla-Sena, Timemania e Dia
          de Sorte. Cadastre os números que você sempre joga e veja se
          bateram com o último sorteio ou com um concurso específico.
        </p>
        <p>Ative o JavaScript no navegador para usar a ferramenta interativa.</p>
      </main>
    </noscript>
  </body>
</html>
