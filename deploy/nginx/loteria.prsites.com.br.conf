server {
    listen 2052 ssl http2;
    listen [::]:2052 ssl http2;
    server_name loteria.prsites.com.br;

    # Atras do Cloudflare em :2052 -> emitir redirects relativos para nunca
    # vazar a porta interna num header Location.
    absolute_redirect off;

    # Certificado Origin da Cloudflare (wildcard *.prsites.com.br),
    # o mesmo ja usado pelo system-design-simulator. Exigido pelo modo SSL
    # Full (strict).
    ssl_certificate     /etc/ssl/cloudflare/prsites_com_br.pem;
    ssl_certificate_key /etc/ssl/cloudflare/prsites_com_br.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

    # Symlink atomico gerenciado por deploy/build-and-run.sh: aponta sempre
    # para a release publicada mais recente.
    root /var/www/loteria.prsites.com.br/current;
    index index.html;

    # add_header nao e herdado por um location que declara o seu proprio
    # add_header (regra de heranca do nginx) — por isso os tres headers de
    # seguranca sao repetidos em cada location abaixo, nao só declarados uma
    # vez no server. Sem repetir, o unico ponto do site que os recebia era
    # /robots.txt e /sitemap.xml, que nao caem em nenhum dos locations
    # abaixo.
    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        expires 1d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
